[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spielstream"
version = "0.0.1"
description = "A local, open-source playground for learning and sharing Streamhouse architectures."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Spielstream maintainers" }]
keywords = ["streaming", "streamhouse", "flink", "kafka", "redpanda", "iceberg", "mcp", "ai-agents", "tutorial"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Education",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/spielstream/spielstream"
Repository = "https://github.com/spielstream/spielstream"
Issues = "https://github.com/spielstream/spielstream/issues"

[project.scripts]
spielstream = "spielstream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spielstream"]
